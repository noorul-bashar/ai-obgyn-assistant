version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: obgyn_assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      # "api" resolves via Docker's internal DNS to the api service above.
      OBGYN_API_BASE_URL: http://api:8000
      OBGYN_API_KEY: ${API_KEY:-change-me}
    depends_on:
      - api

volumes:
  pgdata:
